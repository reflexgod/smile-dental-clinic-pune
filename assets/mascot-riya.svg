<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-labelledby="riya-mascot-title riya-mascot-desc">
  <title id="riya-mascot-title">Riya — Smile Dental Clinic Assistant</title>
  <desc id="riya-mascot-desc">Warm ivory tooth emblem character with calm charcoal eyes and a tailored sage-teal collar.</desc>

  <!-- Warm architectural badge backing -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#F3ECE0" stroke="#1C2526" stroke-width="2.5"/>

  <!-- Sculpted tooth silhouette (matches Smile Dental brand emblem geometry) -->
  <path
    d="M60 25C50.5 25 44.5 20.5 36.8 20.5C26.8 20.5 21 29.2 21 41C21 52.8 26 61 28.8 71.8C31 80.6 32.4 95 39.6 95C45.5 95 47.8 84.8 52.8 80.2C55 78.2 57.5 77.2 60 77.2C62.5 77.2 65 78.2 67.2 80.2C72.2 84.8 74.5 95 80.4 95C87.6 95 89 80.6 91.2 71.8C94 61 99 52.8 99 41C99 29.2 93.2 20.5 83.2 20.5C75.5 20.5 69.5 25 60 25Z"
    fill="#FFFDF9"
    stroke="#1C2526"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtle warm enamel inner contour -->
  <path
    d="M30 39C30 31.8 34 27.8 39.5 27.8C43.5 27.8 47 29.4 50.8 30.2"
    stroke="#E7DecF"
    stroke-width="2.4"
    stroke-linecap="round"
  />

  <!-- Soft terracotta cheek warmth -->
  <circle cx="38.5" cy="54.5" r="5.5" fill="#C67B61" fill-opacity="0.22"/>
  <circle cx="81.5" cy="54.5" r="5.5" fill="#C67B61" fill-opacity="0.22"/>

  <!-- Calm, friendly eyes -->
  <g class="riya-eyes">
    <circle cx="45.5" cy="47.5" r="3.8" fill="#1C2526"/>
    <circle cx="44.3" cy="46.2" r="1.2" fill="#FFFDF9"/>
    <circle cx="74.5" cy="47.5" r="3.8" fill="#1C2526"/>
    <circle cx="73.3" cy="46.2" r="1.2" fill="#FFFDF9"/>
  </g>

  <!-- Relaxed brow lines -->
  <path d="M40.5 39.5C42.8 38 46.8 38 49 39.2" stroke="#1C2526" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M71 39.2C73.2 38 77.2 38 79.5 39.5" stroke="#1C2526" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Warm smile -->
  <path d="M53.2 54.2C55.5 57.5 64.5 57.5 66.8 54.2" stroke="#1C2526" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Tailored sage-teal clinic collar -->
  <path
    d="M27.2 66.8C38.5 73.2 81.5 73.2 92.8 66.8C91.6 72 90.2 75.8 88.5 78C76 83.2 44 83.2 31.5 78C29.8 75.8 28.4 72 27.2 66.8Z"
    fill="#24635B"
    stroke="#1C2526"
    stroke-width="2.8"
    stroke-linejoin="round"
  />

  <!-- Terracotta collar tab -->
  <path
    d="M64 72.5L69.5 85.5L61.5 84L59 73"
    fill="#C67B61"
    stroke="#1C2526"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
