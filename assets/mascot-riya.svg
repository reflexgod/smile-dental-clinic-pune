<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-labelledby="riya-mascot-title riya-mascot-desc">
  <title id="riya-mascot-title">Riya — Smile Dental Clinic Assistant Mascot</title>
  <desc id="riya-mascot-desc">A warm, sculpted ivory tooth character with expressive navy eyes, a tailored muted-teal collar scarf, and a subtle botanical sparkle.</desc>
  <defs>
    <linearGradient id="riya-enamel" x1="26" y1="14" x2="92" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="62%" stop-color="#F7F2E7"/>
      <stop offset="100%" stop-color="#EAE1D0"/>
    </linearGradient>
    <linearGradient id="riya-teal" x1="34" y1="68" x2="88" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E756C"/>
      <stop offset="100%" stop-color="#13524B"/>
    </linearGradient>
    <radialGradient id="riya-cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D98A6C" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#D98A6C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Subtle ground shadow -->
  <ellipse cx="60" cy="109" rx="26" ry="4.5" fill="#112230" fill-opacity="0.1"/>

  <!-- Botanical teal sparkle (top right) -->
  <path d="M98 18C98 23.5 102.5 28 108 28C102.5 28 98 32.5 98 38C98 32.5 93.5 28 88 28C93.5 28 98 23.5 98 18Z" fill="#1B6B63"/>
  <circle cx="23" cy="28" r="2.5" fill="#C89D66"/>

  <!-- Sculpted tooth silhouette -->
  <path d="M60 21C49.5 21 43 16 34.5 16C23.5 16 17 25.5 17 38.5C17 51.5 22.5 60.5 25.5 72.5C28 82.5 29.5 99 37.5 99C44 99 46.5 87.5 52 82.5C54.5 80.2 57.2 79 60 79C62.8 79 65.5 80.2 68 82.5C73.5 87.5 76 99 82.5 99C90.5 99 92 82.5 94.5 72.5C97.5 60.5 103 51.5 103 38.5C103 25.5 96.5 16 85.5 16C77 16 70.5 21 60 21Z" fill="url(#riya-enamel)" stroke="#112230" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crown enamel highlight -->
  <path d="M27 36C27 28 31.5 23.5 37.5 23.5C42 23.5 46 25.5 50 26.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- Crown gentle contour crease -->
  <path d="M49 21.5C54 24.8 66 24.8 71 21.5" stroke="#D5CBB8" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Warm cheek blush -->
  <circle cx="36" cy="54" r="7.5" fill="url(#riya-cheek)"/>
  <circle cx="84" cy="54" r="7.5" fill="url(#riya-cheek)"/>

  <!-- Expressive eyes -->
  <g class="riya-eyes">
    <ellipse cx="44" cy="46.5" rx="4.2" ry="5" fill="#112230"/>
    <circle cx="42.6" cy="44.6" r="1.5" fill="#FFFDF9"/>
    <circle cx="45.5" cy="48.2" r="0.8" fill="#1B6B63"/>

    <ellipse cx="76" cy="46.5" rx="4.2" ry="5" fill="#112230"/>
    <circle cx="74.6" cy="44.6" r="1.5" fill="#FFFDF9"/>
    <circle cx="77.5" cy="48.2" r="0.8" fill="#1B6B63"/>
  </g>

  <!-- Subtle warm eyebrows -->
  <path d="M38.5 37.5C41 35.8 45.5 35.8 48 37.2" stroke="#112230" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M72 37.2C74.5 35.8 79 35.8 81.5 37.5" stroke="#112230" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Reassuring smile -->
  <path d="M52.5 54.5C55 58.2 65 58.2 67.5 54.5" stroke="#112230" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Tailored muted-teal receptionist scarf / collar -->
  <path d="M24.5 67.5C36.5 74.5 83.5 74.5 95.5 67.5C94.3 73.2 92.8 77.2 91 79.5C77.5 85.2 42.5 85.2 29 79.5C27.2 77.2 25.7 73.2 24.5 67.5Z" fill="url(#riya-teal)" stroke="#112230" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Scarf knot and warm brass pin detail -->
  <path d="M68 74.5L75 90.5L65.5 88.5L62 75.5" fill="#175E57" stroke="#112230" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="65" cy="75.5" r="3.2" fill="#D5A667" stroke="#112230" stroke-width="2"/>
</svg>
